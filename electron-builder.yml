appId: com.warroom.app
productName: Warroom
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json
# Offline dictation (Beta) uses @huggingface/transformers, which pulls in
# onnxruntime-node — a native addon (.node binary). Native addons can't be
# dlopen'd from inside an asar archive, so they need to be unpacked onto the
# real filesystem at install time.
asarUnpack:
  - node_modules/onnxruntime-node/**
extraResources:
  - from: electron/skills
    to: skills
  - from: electron/prompts
    to: prompts
  - from: resources/icon.png
    to: icon.png
  - from: resources/icon.ico
    to: icon.ico
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  # Code signing. Without it a downloaded build has no verifiable origin and
  # macOS shows the "damaged / unidentified developer" scare, which trains users
  # to right-click-Open past Gatekeeper — the exact habit that makes a tampered
  # build easy to land.
  #
  # These settings only take effect when a Developer ID cert is in the keychain.
  # With none present, electron-builder skips signing and `npm run dist` still
  # produces a working local dmg, so this is safe to leave enabled.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # Notarization runs only when APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, and
  # APPLE_TEAM_ID are set in the environment; otherwise it is skipped.
  notarize: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}
  # Set CSC_LINK (path or base64 of the .pfx) and CSC_KEY_PASSWORD to sign.
  # Unset, builds stay unsigned and SmartScreen will warn on download.
  signingHashAlgorithms:
    - sha256
protocols:
  - name: Warroom
    schemes:
      - warroom
    role: Viewer
fileAssociations:
  - ext: docx
    name: Word Document
    mimeType: application/vnd.openxmlformats-officedocument.wordprocessingml.document
    role: Viewer
    isPackage: false
  - ext: xlsx
    name: Excel Spreadsheet
    mimeType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    role: Viewer
    isPackage: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
